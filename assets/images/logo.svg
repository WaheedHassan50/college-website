<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE043" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7B1C" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F5132" />
      <stop offset="100%" stop-color="#052c1a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="100" cy="100" r="95" fill="#0A3622" stroke="url(#goldGrad)" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3,2"/>
  
  <!-- Curved Path for College Name -->
  <path id="textPathUpper" d="M 22,100 A 78,78 0 1,1 178,100" fill="none"/>
  <text font-family="'Cinzel', 'Times New Roman', serif" font-size="11.5" font-weight="bold" fill="#FCE043" letter-spacing="1.5">
    <textPath href="#textPathUpper" startOffset="50%" text-anchor="middle">
      GOVT. GRADUATE COLLEGE
    </textPath>
  </text>

  <!-- Lower text -->
  <path id="textPathLower" d="M 175,105 A 76,76 0 0,1 25,105" fill="none"/>
  <text font-family="'Cinzel', 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#FCE043" letter-spacing="2.5">
    <textPath href="#textPathLower" startOffset="50%" text-anchor="middle">
      ★ HAFIZABAD ★
    </textPath>
  </text>

  <!-- Inner Badge / Shield Container -->
  <circle cx="100" cy="100" r="62" fill="url(#greenGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Crescent and Star -->
  <g transform="translate(100, 56) scale(0.65)">
    <!-- Crescent -->
    <path d="M -2,-8 A 9,9 0 1 1 -2,8 A 12,12 0 1 0 -2,-8 Z" fill="#FCE043" transform="rotate(-35)"/>
    <!-- Star -->
    <polygon points="4,-4 5.5,-1 8.5,-1 6,1 7,4 4,2 1,4 2,1 -0.5,-1 2.5,-1" fill="#FCE043" transform="scale(0.8) translate(3,-3)"/>
  </g>

  <!-- Arabic Calligraphy Motto: "Rabbi Zidni Ilma" stylized -->
  <text x="100" y="78" text-anchor="middle" font-family="'Amiri', 'Traditional Arabic', serif" font-size="11" font-weight="bold" fill="#FCE043">
    رَبِّ زِدْنِي عِلْمًا
  </text>

  <!-- Open Book of Knowledge -->
  <g transform="translate(100, 102) scale(0.85)">
    <!-- Book spine & pages left -->
    <path d="M 0,10 C -12,4 -28,2 -35,5 C -35,-12 -28,-14 -12,-12 C -4,-11 0,-8 0,-8 Z" fill="#FDFDFD" stroke="#D4AF37" stroke-width="1.2"/>
    <!-- Book pages right -->
    <path d="M 0,10 C 12,4 28,2 35,5 C 35,-12 28,-14 12,-12 C 4,-11 0,-8 0,-8 Z" fill="#FDFDFD" stroke="#D4AF37" stroke-width="1.2"/>
    <!-- Page Lines Left -->
    <line x1="-28" y1="-5" x2="-8" y2="-4" stroke="#0F5132" stroke-width="0.8"/>
    <line x1="-29" y1="-1" x2="-8" y2="0" stroke="#0F5132" stroke-width="0.8"/>
    <line x1="-27" y1="3" x2="-8" y2="4" stroke="#0F5132" stroke-width="0.8"/>
    <!-- Page Lines Right -->
    <line x1="8" y1="-4" x2="28" y2="-5" stroke="#0F5132" stroke-width="0.8"/>
    <line x1="8" y1="0" x2="29" y2="-1" stroke="#0F5132" stroke-width="0.8"/>
    <line x1="8" y1="4" x2="27" y2="3" stroke="#0F5132" stroke-width="0.8"/>
    
    <!-- Torch of Guidance in Center -->
    <path d="M -3,2 L 3,2 L 1.5,16 L -1.5,16 Z" fill="url(#goldGrad)" stroke="#B38600" stroke-width="0.8"/>
    <!-- Torch Flame -->
    <path d="M 0,-8 C -4,-3 -4,1 0,2 C 4,1 4,-3 0,-8 Z" fill="#FF5722"/>
    <path d="M 0,-5 C -2,-2 -2,1 0,1.5 C 2,1 2,-2 0,-5 Z" fill="#FFC107"/>
  </g>

  <!-- Ribbon / Banner at Bottom -->
  <g transform="translate(100, 134)">
    <path d="M -32,-3 L 32,-3 L 26,9 L -26,9 Z" fill="url(#goldGrad)" stroke="#8A6708" stroke-width="1"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Arial', sans-serif" font-size="7" font-weight="900" fill="#0A3622" letter-spacing="1">
      ESTD. 1958
    </text>
  </g>
</svg>
