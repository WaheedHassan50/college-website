<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F5132" />
      <stop offset="100%" stop-color="#052c1a" />
    </linearGradient>
    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="480" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative Islamic / Academic geometric pattern in background -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="rgba(212,175,55,0.15)" stroke-width="2"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="rgba(212,175,55,0.1)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Academic Robe / Suit Silhouette -->
  <!-- Shoulders & Coat -->
  <path d="M 60,480 C 80,360 140,320 200,320 C 260,320 320,360 340,480 Z" fill="#1A202C"/>
  <path d="M 120,480 L 150,335 L 200,380 L 250,335 L 280,480 Z" fill="#2D3748"/>
  
  <!-- White Shirt Collar -->
  <polygon points="170,320 200,370 230,320 220,300 180,300" fill="#FFFFFF"/>
  
  <!-- Golden Tie -->
  <polygon points="194,340 206,340 212,430 200,450 188,430" fill="url(#tieGrad)"/>

  <!-- Neck -->
  <rect x="180" y="270" width="40" height="45" rx="5" fill="#E2B18A"/>

  <!-- Head -->
  <ellipse cx="200" cy="200" rx="60" ry="75" fill="#E8B896"/>

  <!-- Hair / Dignified Academic Haircut -->
  <path d="M 140,190 C 135,140 160,120 200,120 C 240,120 265,140 260,190 C 255,160 240,135 200,135 C 160,135 145,160 140,190 Z" fill="#4A5568"/>
  
  <!-- Glasses -->
  <rect x="160" y="180" width="32" height="22" rx="5" fill="none" stroke="#D4AF37" stroke-width="3"/>
  <rect x="208" y="180" width="32" height="22" rx="5" fill="none" stroke="#D4AF37" stroke-width="3"/>
  <line x1="192" y1="190" x2="208" y2="190" stroke="#D4AF37" stroke-width="3"/>
  <line x1="145" y1="188" x2="160" y2="188" stroke="#D4AF37" stroke-width="2.5"/>
  <line x1="240" y1="188" x2="255" y2="188" stroke="#D4AF37" stroke-width="2.5"/>

  <!-- Eyes behind glasses -->
  <circle cx="176" cy="191" r="3.5" fill="#2D3748"/>
  <circle cx="224" cy="191" r="3.5" fill="#2D3748"/>

  <!-- Eyebrows -->
  <path d="M 160,174 Q 176,168 192,174" fill="none" stroke="#4A5568" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 208,174 Q 224,168 240,174" fill="none" stroke="#4A5568" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 200,190 L 196,215 L 204,215" fill="none" stroke="#C98B63" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Gentle Smile -->
  <path d="M 185,235 Q 200,246 215,235" fill="none" stroke="#9C5B32" stroke-width="3" stroke-linecap="round"/>

  <!-- Gold Lapel Pin with Crescent -->
  <circle cx="145" cy="385" r="9" fill="url(#tieGrad)"/>
  <path d="M 144,380 A 4.5,4.5 0 1 1 144,390 A 6,6 0 1 0 144,380 Z" fill="#0A3622"/>

  <!-- Badge banner at bottom -->
  <rect x="30" y="420" width="340" height="44" rx="8" fill="rgba(10, 54, 34, 0.95)" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="200" y="440" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#FCE043">
    PROF. MUHAMMAD INAYAT BHATTI
  </text>
  <text x="200" y="456" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#E2E8F0" letter-spacing="1">
    PRINCIPAL • GOVT. GRADUATE COLLEGE HAFIZABAD
  </text>
</svg>
